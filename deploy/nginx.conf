# nginx: /etc/nginx/sites-available/life-light
# После копирования: sudo certbot --nginx -d life-light.ru -d www.life-light.ru
# certbot сам добавит HTTPS (443) и редирект с http.
server {
    listen 80;
    server_name life-light.ru www.life-light.ru;

    client_max_body_size 15m;        # форма с фото до 5 штук
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
